services:
  growth-agent:
    build: .
    restart: unless-stopped
    env_file: .env
    # No `ports:` - this must never be publicly reachable or routed through
    # nginx. Use `docker exec` or curl from another container on the same
    # network to hit /health or /run-now for manual testing.
    volumes:
      # Read-only bind mount for the GA4/Search Console service-account JSON
      # key. This file is per-host (gitignored, never committed) - see README
      # for how to get it onto each host.
      - ./secrets:/app/secrets:ro
    networks:
      - datalayer_shared

networks:
  datalayer_shared:
    # Joins the existing datalayer-ecommerce Postgres/web network (same
    # compose project on both local dev and the prod VPS - see
    # docker-compose.prod.yml, which just adds a host port-forward to the
    # same `db` service) so this container can reach Postgres by hostname
    # (`db`). Compose's default network name is "<project_dir_name>_default"
    # - it differs per host if the datalayer-ecommerce checkout's directory
    # name differs (e.g. local dev clones it as "datalayer-ecommerce", the
    # VPS clones it as "datalayer"). Set GROWTH_AGENT_NETWORK in .env to
    # match - confirm with:
    #   docker network ls | grep datalayer
    # Compose reads .env in this directory automatically for this kind of
    # substitution, no env_file: wiring needed.
    name: ${GROWTH_AGENT_NETWORK:-datalayer-ecommerce_default}
    external: true
